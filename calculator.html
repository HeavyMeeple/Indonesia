<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indonesia – Operations Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#1e293b;border-bottom:1px solid #334155;flex-shrink:0}
h1{font-size:15px;font-weight:700;color:#f1f5f9}
.layout{display:flex;flex:1;overflow:hidden}
#map-pane{flex:1;overflow:hidden;background:#bfdbfe;position:relative}
#map-svg{width:100%;height:100%;cursor:crosshair}
.side{width:330px;flex-shrink:0;background:#0f172a;border-left:1px solid #334155;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid #334155;flex-shrink:0}
.tab{flex:1;padding:8px;background:none;border:none;color:#64748b;cursor:pointer;font-size:13px;font-weight:600;border-bottom:2px solid transparent}
.tab.active{color:#e2e8f0;border-bottom-color:#3b82f6}
.tab-content{flex:1;overflow-y:auto;padding:8px}
.section{background:#1e293b;border-radius:8px;padding:8px;margin-bottom:8px}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sec-title{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
input[type=text]{flex:1;background:#0f172a;border:1px solid #334155;border-radius:4px;padding:2px 6px;color:#e2e8f0;font-size:13px;min-width:0}
input[type=number]{width:38px;background:#0f172a;border:1px solid #334155;border-radius:4px;padding:2px 4px;color:#e2e8f0;font-size:12px;text-align:center}
select{background:#0f172a;border:1px solid #334155;border-radius:4px;padding:2px 4px;color:#e2e8f0;font-size:11px}
.btn{background:#334155;border:none;border-radius:4px;padding:3px 9px;color:#e2e8f0;cursor:pointer;font-size:11px;white-space:nowrap}
.btn:hover{background:#475569}
.btn.active{background:#3b82f6;color:#fff}
.btn.danger{background:#7f1d1d;color:#fca5a5}
.btn.green{background:#15803d;color:#bbf7d0}
.badge{display:inline-flex;align-items:center;justify-content:center;background:#3b82f6;color:#fff;border-radius:10px;width:17px;height:17px;font-size:10px;margin-left:3px}
.good-pill{padding:1px 7px;border-radius:10px;color:#fff;font-size:10px;font-weight:700;white-space:nowrap}
.hint{color:#64748b;font-size:11px;text-align:center;padding:8px}
.tool-bar{background:#1e3a5f;border-radius:6px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;color:#93c5fd;font-size:12px;margin-bottom:6px;gap:8px}
.tool-bar.on{background:#1e40af;color:#fff}
/* Results */
.r-company{background:#1e293b;border-radius:8px;padding:8px;margin-bottom:8px}
.r-hdr{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.r-nums{margin-left:auto;display:flex;gap:8px;align-items:center}
.num-g{color:#4ade80;font-weight:700}
.num-r{color:#f87171;font-weight:700}
.num-b{font-size:15px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:3px 5px;color:#64748b;border-bottom:1px solid #334155}
td{padding:3px 5px;border-bottom:1px solid #1e293b;color:#e2e8f0}
.sea-path{color:#7dd3fc}
.ship-tag{background:#0f172a;border:1px solid #334155;border-radius:3px;padding:1px 5px;font-size:10px;margin:2px}
.totals-section{background:#0f172a;border-radius:8px;padding:10px;margin-top:4px}
.player-total{display:flex;align-items:center;gap:10px;padding:5px 8px;margin-bottom:4px;background:#1e293b;border-radius:6px;flex-wrap:wrap;border-left:4px solid transparent}
#error-bar{background:#7f1d1d;color:#fca5a5;padding:6px 12px;font-size:12px;display:none;flex-shrink:0}
</style>
</head>

// ── Tool helpers ─────────────────────────────────────────────────────────────
function setTool(t){ tool = t; renderMap(); renderSetup(); }

function handleMapClick(e){
  const svg = document.getElementById('map-svg');
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const svgPt = pt.matrixTransform(svg.getScreenCTM().inverse());
  const x = svgPt.x, y = svgPt.y;

  // Find nearest area within threshold
  let best = null, bestD = 999;
  for(const [id,[px,py]] of Object.entries(LAND_POS)){
    const d = Math.hypot(px-x, py-y);
    if(d < 50 && d < bestD){ bestD=d; best={id,type:'L'}; }
  }
  for(const [id,[px,py]] of Object.entries(SEA_POS)){
    const d = Math.hypot(px-x, py-y);
    if(d < 60 && d < bestD){ bestD=d; best={id,type:'S'}; }
  }
  if(!best) return;

  if(tool.kind==='factory' && best.type==='L'){
    const co = prodCompanies.find(c=>c.id===tool.companyId);
    if(!co) return;
    // Remove from other companies and cities
    prodCompanies.forEach(c=>{ c.areaIds=c.areaIds.filter(a=>a!==best.id); });
    cities = cities.filter(c=>c.areaId!==best.id);
    if(!co.areaIds.includes(best.id)) co.areaIds.push(best.id);
    else co.areaIds = co.areaIds.filter(a=>a!==best.id); // toggle off
    renderMap(); renderSetup();
  } else if(tool.kind==='city' && best.type==='L'){
    prodCompanies.forEach(c=>{ c.areaIds=c.areaIds.filter(a=>a!==best.id); });
    if(!cities.find(c=>c.areaId===best.id)) cities.push({areaId:best.id,demands:{}});
    renderMap(); renderSetup();
  } else if(tool.kind==='ship' && best.type==='S'){
    const co = shipCompanies.find(c=>c.id===tool.companyId);
    if(!co) return;
    co.ships[best.id] = (co.ships[best.id]||0)+1;
    renderMap(); renderSetup();
  } else if(tool.kind==='erase'){
    prodCompanies.forEach(c=>{ c.areaIds=c.areaIds.filter(a=>a!==best.id); });
    cities = cities.filter(c=>c.areaId!==best.id);
    shipCompanies.forEach(c=>{ delete c.ships[best.id]; });
    renderMap(); renderSetup();
  }
}

// ── Map Rendering ────────────────────────────────────────────────────────────
function getAreaOwner(id){
  for(const co of prodCompanies){
    if(co.areaIds.includes(id)) return co;
  }
  return null;
}

function renderMap(){
  const svg = document.getElementById('map-svg');
  const areaHighlight = tool.kind!=='none';
  let html = '';

  // Sea areas
  for(const [id,[x,y]] of Object.entries(SEA_POS)){
    const totalShips = shipCompanies.reduce((s,c)=>s+(c.ships[id]||0),0);
    const fill = totalShips>0 ? '#0ea5e9' : '#93c5fd';
    const stroke = (tool.kind==='ship'||tool.kind==='erase') ? '#60a5fa' : '#3b82f6';
    html += `<g class="area" data-id="${id}">
      <circle cx="${x}" cy="${y}" r="48" fill="${fill}" stroke="${stroke}" stroke-width="2" opacity="0.85"/>
      <text x="${x}" y="${y-14}" text-anchor="middle" font-size="16" fill="#1e3a5f" font-weight="bold">${id}</text>
      ${totalShips?`<text x="${x}" y="${y+16}" text-anchor="middle" font-size="18" fill="#0c4a6e" font-weight="bold">⚓${totalShips}</text>`:''}
    </g>`;
  }

  // Land areas
  for(const [id,[x,y]] of Object.entries(LAND_POS)){
    const owner = getAreaOwner(id);
    const isCity = cities.find(c=>c.areaId===id);
    const fill = owner ? players.find(p=>p.id===owner.playerId)?.color||'#6b7280'
                : isCity ? '#facc15' : '#d1d5db';
    const stroke = areaHighlight ? '#60a5fa' : '#6b7280';
    const r = isCity ? 36 : 26;
    const goodLabel = owner ? owner.good[0] : (isCity ? 'C' : '');
    html += `<g class="area" data-id="${id}">
      <circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
      <text x="${x}" y="${y-10}" text-anchor="middle" font-size="12" fill="#374151">${id}</text>
      ${goodLabel?`<text x="${x}" y="${y+12}" text-anchor="middle" font-size="13" fill="#111827" font-weight="bold">${goodLabel}</text>`:''}
    </g>`;
  }

  svg.innerHTML = html;
}

// ── Solver ───────────────────────────────────────────────────────────────────
function buildZones(company){
  const areaSet = new Set(company.areaIds);
  const unvisited = [...areaSet].sort();
  const groups = [];
  while(unvisited.length>0){
    const seed = unvisited.shift();
    const queue = [seed], group = [], remaining = new Set(unvisited);
    remaining.delete(seed);
    while(queue.length>0){
      const cur = queue.shift(); group.push(cur);
      for(const nb of (GRAPH[cur]?.l||[])){
        if(GRAPH[nb]?.t==='L' && remaining.has(nb)){ remaining.delete(nb); queue.push(nb); }
      }
    }
    unvisited.splice(0,unvisited.length,...[...remaining].sort());
    groups.push([...group].sort());
  }
  return groups.map((areaIds,i)=>{
    const adjSea = new Set();
    for(const a of areaIds) for(const s of (GRAPH[a]?.s||[])) if(GRAPH[s]?.t==='S') adjSea.add(s);
    return {zoneId:`${company.id}:z${i+1}`,areaIds,adjacentSeaAreaIds:[...adjSea].sort(),supply:areaIds.length};
  });
}

function buildCityDemands(good){
  return cities.filter(c=>(c.demands[good]||0)>0).map(c=>{
    const adjSea = new Set();
    for(const s of (GRAPH[c.areaId]?.s||[])) if(GRAPH[s]?.t==='S') adjSea.add(s);
    return {cityId:c.areaId,cityAreaId:c.areaId,adjacentSeaAreaIds:[...adjSea].sort(),remainingDemand:c.demands[good]};
  }).sort((a,b)=>a.cityId.localeCompare(b.cityId));
}

function buildShipNetworks(){
  return shipCompanies.filter(co=>Object.values(co.ships).some(n=>n>0)).map(co=>{
    const seaIds = Object.keys(co.ships).filter(s=>(co.ships[s]||0)>0).sort();
    const cap = seaIds.map(s=>({seaAreaId:s,capacity:co.ships[s]*(1+co.hullLevel)}));
    const seaSet = new Set(seaIds);
    const laneMap = new Map();
    for(const s of seaIds){
      for(const nb of (GRAPH[s]?.s||[])){
        if(seaSet.has(nb)){ const k=[s,nb].sort().join('|'); if(!laneMap.has(k)) laneMap.set(k,{fromSeaAreaId:[s,nb].sort()[0],toSeaAreaId:[s,nb].sort()[1]}); }
      }
    }
    return {shippingCompanyId:co.id,seaLanes:[...laneMap.values()],seaAreaCapacities:cap};
  }).sort((a,b)=>a.shippingCompanyId.localeCompare(b.shippingCompanyId));
}

// Min-Cost Max-Flow (Successive Shortest Paths with Dijkstra+potentials)
function solveDelivery(problem){
  const {zoneSupplies,cityDemands,shippingCompanyNetworks,shippingFeePerShipUse,ownedShippingCompanyIds} = problem;

  // Build flow network
  const nodes = []; // {kind, ...}
  const adj = [];   // adj[i] = [{to,rev,cap,cost,flow,meta}]

  function addNode(n){ adj.push([]); return nodes.push(n)-1; }
  function addEdge(u,v,cap,cost,meta){
    adj[u].push({to:v,rev:adj[v].length,cap,cost,flow:0,meta});
    adj[v].push({to:u,rev:adj[u].length-1,cap:0,cost:-cost,flow:0});
  }

  const src = addNode({k:'src'});
  const snk = addNode({k:'snk'});

  const totalSupply = zoneSupplies.reduce((s,z)=>s+z.supply,0);
  const totalDemand = cityDemands.reduce((s,c)=>s+c.remainingDemand,0);
  const inf = Math.max(1,totalSupply,totalDemand);

  // Zone nodes
  const zoneIdx = new Map();
  for(const z of [...zoneSupplies].sort((a,b)=>a.zoneId.localeCompare(b.zoneId))){
    const i = addNode({k:'zone',zoneId:z.zoneId});
    zoneIdx.set(z.zoneId,i);
    addEdge(src,i,z.supply,0);
  }

  // City nodes
  const cityIdx = new Map();
  for(const c of [...cityDemands].sort((a,b)=>a.cityId.localeCompare(b.cityId))){
    const i = addNode({k:'city',cityId:c.cityId});
    cityIdx.set(c.cityId,i);
    addEdge(i,snk,c.remainingDemand,0,{kind:'city-to-sink',cityId:c.cityId});
  }

  const ownedSet = new Set(ownedShippingCompanyIds);
  let maxTotalShipCost = 0;
  for(const sn of shippingCompanyNetworks) for(const sa of sn.seaAreaCapacities) maxTotalShipCost+=sa.capacity*shippingFeePerShipUse;
  const nonOwnedScale = maxTotalShipCost+1;

  for(const sn of [...shippingCompanyNetworks].sort((a,b)=>a.shippingCompanyId.localeCompare(b.shippingCompanyId))){
    const seaInIdx = new Map(), seaOutIdx = new Map();
    for(const sa of [...sn.seaAreaCapacities].sort((a,b)=>a.seaAreaId.localeCompare(b.seaAreaId))){
      const si = addNode({k:'sea-in',cid:sn.shippingCompanyId,sid:sa.seaAreaId});
      const so = addNode({k:'sea-out',cid:sn.shippingCompanyId,sid:sa.seaAreaId});
      seaInIdx.set(sa.seaAreaId,si); seaOutIdx.set(sa.seaAreaId,so);
      const cost = ownedSet.has(sn.shippingCompanyId)
        ? shippingFeePerShipUse
        : shippingFeePerShipUse*nonOwnedScale + shippingFeePerShipUse;
      addEdge(si,so,sa.capacity,cost,{kind:'sea-capacity',cid:sn.shippingCompanyId,sid:sa.seaAreaId});
    }
    const seaSet = new Set(seaInIdx.keys());
    // Zone → sea-in
    for(const z of [...zoneSupplies].sort((a,b)=>a.zoneId.localeCompare(b.zoneId))){
      const zi = zoneIdx.get(z.zoneId);
      for(const sid of [...z.adjacentSeaAreaIds].sort()){
        if(seaSet.has(sid)) addEdge(zi,seaInIdx.get(sid),z.supply,0,{kind:'zone-to-sea',zoneId:z.zoneId,cid:sn.shippingCompanyId,sid});
      }
    }
    // Sea lanes (bidirectional)
    for(const lane of [...sn.seaLanes].sort((a,b)=>a.fromSeaAreaId.localeCompare(b.fromSeaAreaId)||a.toSeaAreaId.localeCompare(b.toSeaAreaId))){
      if(seaSet.has(lane.fromSeaAreaId)&&seaSet.has(lane.toSeaAreaId)){
        addEdge(seaOutIdx.get(lane.fromSeaAreaId),seaInIdx.get(lane.toSeaAreaId),inf,0);
        addEdge(seaOutIdx.get(lane.toSeaAreaId),seaInIdx.get(lane.fromSeaAreaId),inf,0);
      }
    }
    // Sea-out → city
    for(const c of [...cityDemands].sort((a,b)=>a.cityId.localeCompare(b.cityId))){
      const ci = cityIdx.get(c.cityId);
      for(const sid of [...c.adjacentSeaAreaIds].sort()){
        if(seaSet.has(sid)) addEdge(seaOutIdx.get(sid),ci,c.remainingDemand,0,{kind:'sea-to-city',cid:sn.shippingCompanyId,cityId:c.cityId,sid});
      }
    }
  }

  // Dijkstra with potentials (successive shortest paths)
  const N = nodes.length;
  const pot = new Array(N).fill(0);
  let totalFlow = 0;
  const augmentations = [];

  while(true){
    const dist = new Array(N).fill(Infinity);
    const prev = new Array(N).fill(-1);
    const prevE = new Array(N).fill(-1);
    const vis = new Array(N).fill(false);
    dist[src] = 0;

    for(let iter=0;iter<N;iter++){
      let u=-1;
      for(let i=0;i<N;i++) if(!vis[i]&&dist[i]<(u<0?Infinity:dist[u])) u=i;
      if(u<0||dist[u]===Infinity) break;
      vis[u]=true;
      for(let ei=0;ei<adj[u].length;ei++){
        const e=adj[u][ei];
        if(e.cap-e.flow<=0) continue;
        const rc=e.cost+pot[u]-pot[e.to];
        if(dist[u]+rc<dist[e.to]){ dist[e.to]=dist[u]+rc; prev[e.to]=u; prevE[e.to]=ei; }
      }
    }
    if(prev[snk]<0) break;
    for(let i=0;i<N;i++) if(dist[i]<Infinity) pot[i]+=dist[i];

    let aug=Infinity, v=snk;
    const path=[];
    while(v!==src){ const u=prev[v],ei=prevE[v]; path.push({u,ei}); aug=Math.min(aug,adj[u][ei].cap-adj[u][ei].flow); v=u; }
    for(const {u,ei} of path){ adj[u][ei].flow+=aug; adj[adj[u][ei].to][adj[u][ei].rev].flow-=aug; }
    totalFlow+=aug;
    augmentations.push({amount:aug,path:[...path].reverse()});
  }

  // Decompose flow into paths
  const remFlow = adj.map(edges=>edges.map(e=>e.cap>0&&e.flow>0?e.flow:0));
  const deliveryMap = new Map();
  const shipUseMap = new Map();

  function dfs(u,pathEdges){
    if(u===snk) return true;
    for(let ei=0;ei<adj[u].length;ei++){
      if(remFlow[u][ei]<=0) continue;
      const e=adj[u][ei];
      const visited = new Set(pathEdges.map(p=>p.u));
      if(visited.has(e.to)) continue;
      pathEdges.push({u,ei,e});
      if(dfs(e.to,pathEdges)) return true;
      pathEdges.pop();
    }
    return false;
  }

  while(true){
    const path=[];
    if(!dfs(src,path)) break;
    const amt=Math.min(...path.map(p=>remFlow[p.u][p.ei]));
    if(!isFinite(amt)||amt<=0) break;
    for(const {u,ei} of path) remFlow[u][ei]-=amt;

    let zoneId=null,cityId=null,shipCid=null;
    const seaPath=[];
    for(const {e} of path){
      if(!e.meta) continue;
      if(e.meta.kind==='zone-to-sea'){ zoneId=e.meta.zoneId; shipCid=e.meta.cid; }
      else if(e.meta.kind==='sea-capacity'){ seaPath.push(e.meta.sid); const k=`${e.meta.cid}|${e.meta.sid}`; shipUseMap.set(k,(shipUseMap.get(k)||0)+amt); }
      else if(e.meta.kind==='sea-to-city'){ cityId=e.meta.cityId; shipCid=e.meta.cid; }
    }
    if(zoneId&&cityId&&shipCid){
      const key=`${zoneId}|${cityId}|${shipCid}|${seaPath.join('>')}`;
      const ex=deliveryMap.get(key);
      if(ex) ex.quantity+=amt; else deliveryMap.set(key,{zoneId,cityId,shippingCompanyId:shipCid,quantity:amt,seaPathAreaIds:[...seaPath]});
    }
  }

  const deliveries=[...deliveryMap.values()].sort((a,b)=>`${a.zoneId}|${a.cityId}`.localeCompare(`${b.zoneId}|${b.cityId}`));
  const shipUses=[...shipUseMap.entries()].map(([k,uses])=>{const[cid,sid]=k.split('|');return{shippingCompanyId:cid,seaAreaId:sid,uses};}).sort((a,b)=>a.shippingCompanyId.localeCompare(b.shippingCompanyId)||a.seaAreaId.localeCompare(b.seaAreaId));

  const payMap=new Map();
  for(const su of shipUses){ payMap.set(su.shippingCompanyId,(payMap.get(su.shippingCompanyId)||0)+su.uses*shippingFeePerShipUse); }
  const shippingPayments=[...payMap.entries()].map(([cid,amount])=>({shippingCompanyId:cid,amount}));

  const revenue = totalFlow*(GOOD_REV[problem.good]||0);
  const shippingCost = shippingPayments.reduce((s,p)=>s+p.amount,0);

  return {deliveries,shipUses,shippingPayments,totalDelivered:totalFlow,revenue,shippingCost,netIncome:revenue-shippingCost};
}

function runCalculate(){
  const errBar = document.getElementById('error-bar');
  errBar.style.display='none';
  try{
    const shipNetworks = buildShipNetworks();
    lastResults = prodCompanies.map(co=>{
      const player = players.find(p=>p.id===co.playerId)||{name:'?',color:'#888'};
      const ownedShipIds = shipCompanies.filter(s=>s.playerId===co.playerId).map(s=>s.id);
      const plan = solveDelivery({
        operatingCompanyId:co.id,
        good:co.good,
        shippingFeePerShipUse:SHIP_FEE,
        ownedShippingCompanyIds:ownedShipIds,
        zoneSupplies:buildZones(co),
        cityDemands:buildCityDemands(co.good),
        shippingCompanyNetworks:shipNetworks
      });
      return {company:co,player,plan};
    });
    renderResults();
    switchTab('results');
    const badge = document.getElementById('results-badge');
    badge.style.display=''; badge.textContent=lastResults.length;
  }catch(e){
    errBar.style.display='block'; errBar.textContent='Error: '+(e.message||e);
  }
}

function renderResults(){
  const el = document.getElementById('pane-results');
  if(!lastResults.length){ el.innerHTML='<p class="hint">กด ⚡ Calculate เพื่อคำนวณ</p>'; return; }

  let html='';
  for(const {company:co,player,plan} of lastResults){
    const gc=GOOD_COLOR[co.good];
    html+=`<div class="r-company">
      <div class="r-hdr">
        <span class="good-pill" style="background:${gc}">${co.good}</span>
        <span style="color:${player.color};font-weight:700">${player.name}</span>
        <div class="r-nums">
          <span class="num-g">+$${plan.revenue}</span>
          <span class="num-r">−$${plan.shippingCost}</span>
          <span class="num-b" style="color:${plan.netIncome>=0?'#4ade80':'#f87171'}">= $${plan.netIncome}</span>
          <span style="color:#94a3b8;font-size:11px">${plan.totalDelivered} goods</span>
        </div>
      </div>`;
    if(plan.deliveries.length===0){
      html+=`<p style="color:#64748b;font-style:italic;font-size:11px">ไม่มีเส้นทางส่งสินค้า</p>`;
    } else {
      html+=`<table><thead><tr><th>Zone</th><th>→ เมือง</th><th>จำนวน</th><th>เส้นทางทะเล</th></tr></thead><tbody>`;
      for(const d of plan.deliveries){
        const zn=d.zoneId.split(':z')[1]||d.zoneId;
        html+=`<tr><td>Zone ${zn}</td><td>${d.cityId}</td><td style="color:#f0abfc;font-weight:700">${d.quantity}</td><td class="sea-path">${d.seaPathAreaIds.join('→')}</td></tr>`;
      }
      html+=`</tbody></table>`;
    }
    if(plan.shippingPayments.length){
      html+=`<div style="margin-top:5px;font-size:11px;color:#94a3b8">ค่าเรือ: ${plan.shippingPayments.map(p=>`$${p.amount}`).join(', ')}</div>`;
    }
    html+=`</div>`;
  }

  // Per-player totals
  const playerIds=[...new Set(lastResults.map(r=>r.player.id))];
  html+=`<div class="totals-section"><div style="font-size:11px;color:#94a3b8;text-transform:uppercase;margin-bottom:8px">สรุปต่อผู้เล่น</div>`;
  for(const pid of playerIds){
    const rows=lastResults.filter(r=>r.player.id===pid);
    const pl=rows[0].player;
    const rev=rows.reduce((s,r)=>s+r.plan.revenue,0);
    const ship=rows.reduce((s,r)=>s+r.plan.shippingCost,0);
    const net=rev-ship;
    html+=`<div class="player-total" style="border-left-color:${pl.color}">
      <span style="color:${pl.color};font-weight:700">${pl.name}</span>
      <span class="num-g">+$${rev}</span><span class="num-r">−$${ship}</span>
      <span class="num-b" style="color:${net>=0?'#4ade80':'#f87171'}">= $${net}</span>
    </div>`;
  }
  html+=`</div>`;
  el.innerHTML=html;
}

// ── Init ─────────────────────────────────────────────────────────────────────
renderMap();
renderSetup();
</script>
</body>
</html>
